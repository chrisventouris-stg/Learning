<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Title -->
    <h1>Registration Form</h1>
    <!-- Intro paragraph -->
    <p>Please fill out this form with the required information</p>
    <!-- Form -->
    <form action="https://register-demo.freecodecamp.org" method="post">
        <!-- Fieldset 1: Name, Email, Password -->
         <fieldset>
            <label for="first-name">
                Enter Your First Name: 
                <input type="text" name="first-name" id="first-name" required>
            </label>
            <label for="last-name">
                Enter Your Last Name: 
                <input type="text" name="last-name" id="last-name" required>
            </label>
            <label for="email">
                Enter Your Email: 
                <input type="email" name="email" id="email" required>
            </label>
            <label for="new-password">
                Create a New Password: 
                <input type="password" name="password" id="new-password" pattern="[a-z0-5]{8,}" required>
            </label>
         </fieldset>
         <!-- Fieldset 2: Radio Btns, Personal or Business -->
         <fieldset>
            <legend>Account type (required)</legend>
            <label for="personal-account">
                <input type="radio" name="account-type" value="personal" id="personal-account" checked>
                 Personal
            </label>
            <label for="business-account">
                <input type="radio" name="account-type" value="business" id="business-account">
                 Business
            </label>
         </fieldset>
         <!-- Fieldset 3: Profile picture, Age, Hear about is, Bio -->
         <fieldset>
            <!-- Profile picture -->
            <label for="profile-picture">
                Upload a profile picture:
                <input type="file" name="profile-picture" id="profile-picture">
            </label>
            <!-- Age -->
            <label for="age">
                Input your age (years):
                <input type="number" min="13" max="120" name="age" id="age">
            </label>
            <!-- Where did you hear about us -->
            <label for="referrer">
                How did you hear about us?
                <select name="referrer" id="referrer">
                    <option value="">(select one)</option>
                    <option value="1">freeCodeCamp News</option>
                    <option value="2">freeCodeCamp YouTube Channel</option>
                    <option value="3">freeCodeCamp Forum</option>
                    <option value="4">Other</option>
                </select>
            </label>
            <!-- Bio -->
             <label for="bio">
                Provide a bio:
                <textarea name="bio" id="bio" rows="3" cols="30" placeholder="I like coding on the beach..."></textarea>
             </label>
        </fieldset>
         <!-- T&C Checkbox -->
          <a href="https://www.freecodecamp.org/news/terms-of-service/">
            Read our terms and conditions
          </a>
         <label for="terms-and-conditions">
            <input type="checkbox" name="terms-and-conditions" id="terms-and-conditions" required>
             I accept the terms and conditions
        </label>
         <!-- Submit form -->
         <input type="submit" value="Submit">
    </form>

</body>
</html>
