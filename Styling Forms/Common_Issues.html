<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms: Common Issues</title>
    <style type="text/CSS">
        form{
            margin: 20px;
        }
        input{
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        input[type="color"]{
            width: 60px;
            height: 40px;
            padding: 0;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="date"]{
            padding: 6px 10px;
            border: 2px solid #555;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator{
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Color picker -->
    <form action="">
        <label for="favourite-color">Pick your favourite color:</label>
        <input type="color" id="favourite-color" name="favourite-color">
    </form>
    <!-- Date -->
     <form action="">
        <label for="birthdate">Select your birthdate:</label>
        <input type="date" id="birthdate" name="birthdate">
     </form>
</body>
</html>
