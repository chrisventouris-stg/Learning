<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms: Appearance: none</title>
    <style type="text/css">
        .checkbox{
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
            vertical-align: middle;
        }
        .checkbox:hover{
            border-color: #888;
        }
        .checkbox:checked{
            background-color: #4caf50;
            border-color: #4caf50;
        }
        .checkbox:checked::after{
            content: "";
            position: absolute;
            left: 4px;
            top: 0px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0 ;
            transform: rotate(45deg);
        }
        .checkbox:focus{
            outline: 2px solid #90caf9;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <form action="">
        <label>
            <input type="checkbox" class="checkbox">Agree
        </label>
    </form>
</body>
</html>
