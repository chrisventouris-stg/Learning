<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <!-- Cloud storage -->
        <label class="feature-card" for="cloud-storage">
            <input type="checkbox" id="cloud-storage" name="cloud-storage">
            <h2>Cloud Storage</h2>
            <p>100 Gigabyte secure storage</p>
        </label>
        
        <!-- Dedicated Support -->
        <label class="feature-card" for="dedicated-support">
            <input type="checkbox" id="dedicated-support" name="dedicated-support">
            <h2>Dedicated Support</h2>
            <p>24/7 customer help</p>
        </label>

        <!-- Advanced Analytics -->
        <label class="feature-card" for="advanced-analytics">
            <input type="checkbox" id="advanced-analytics" name="advanced-analytics">
            <h2>Advanced Analytics</h2>
            <p>Insights & reports</p>
        </label>

        <!-- Custom User Themes -->
        <label class="feature-card" for="user-themes">
            <input type="checkbox" id="user-themes" name="user-themes">
            <h2>Custom User Themes</h2>
            <p>Personalized dashboard design</p>
        </label>

        <!-- Multi-User Collab -->
        <label class="feature-card" for="team-access-sharing">
            <input type="checkbox" id="team-access-sharing" name="team-access-sharing">
            <h2>Multi-User Collab</h2>
            <p>Team access and sharing</p>
        </label>

        <!-- API Access -->
        <label class="feature-card" for="api-access">
            <input type="checkbox" id="api-access" name="api-access">
            <h2>API Access</h2>
            <p>Integrate with your custom built tools</p>
        </label>

    </div>
</body>

</html>
