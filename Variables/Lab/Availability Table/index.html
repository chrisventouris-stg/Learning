<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Availability Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="availability-container">
            <h1>Weekly Availability</h1>
            <section aria-labelledby="schedule-heading">
                <h2 id="schedule-heading">Availability Schedule</h2>
                <table>
                    <thead>
                        <tr>
                            <th scope="col"></th>
                            <th scope="col">Monday</th>
                            <th scope="col">Tuesday</th>
                            <th scope="col">Wednesday</th>
                            <th scope="col">Thursday</th>
                            <th scope="col">Friday</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="half">
                            <th class="time" scope="row">9AM</th>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                        </tr>
                        <tr class="sharp">
                            <th class="time" scope="row">10AM</th>
                            <td class="available-0" aria-label="0 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                        </tr>
                        <tr class="half">
                            <th class="time" scope="row">11AM</th>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-0" aria-label="0 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                        </tr>
                        <tr class="sharp">
                            <th class="time" scope="row">12PM</th>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-0" aria-label="0 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                        </tr>
                        <tr class="half">
                            <th class="time" scope="row">1PM</th>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                        </tr>
                        <tr class="sharp">
                            <th class="time" scope="row">2PM</th>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-0" aria-label="0 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                        </tr>
                        <tr class="half">
                            <th class="time" scope="row">3PM</th>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-0" aria-label="0 available"></td>
                        </tr>
                        <tr class="sharp">
                            <th class="time" scope="row">4PM</th>
                            <td class="available-2" aria-label="2 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                        </tr>
                        <tr class="half">
                            <th class="time" scope="row">5PM</th>
                            <td class="available-0" aria-label="0 available"></td>
                            <td class="available-3" aria-label="3 available"></td>
                            <td class="available-4" aria-label="4 available"></td>
                            <td class="available-1" aria-label="1 available"></td>
                            <td class="available-5" aria-label="5+ available"></td>
                        </tr>
                    </tbody>
                </table>
            </section>
            <section aria-labelledby="legend-heading">
                <h2 id="legend-heading">Availability</h2>
                <div id="legend">
                    <span>0</span>
                    <div id="legend-gradient"></div>
                    <span>5+</span>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
