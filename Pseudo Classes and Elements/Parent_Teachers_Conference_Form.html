<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Teacher Conference Form</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- Styles -->
  <style type="text/css">
    body{
      background-color: midnightblue;
      color: whitesmoke;
    }
    .container{
      background-color: #ffffff1a;
      width: 80%;
      max-width: 600px;
      border-radius: 10px;
      margin: 20px auto;
      padding: 10px 20px;
      box-shadow: 0 5px 15px black;
    }
    .center{
      text-align: center;
    }
    .description{
      font-size: 1.2rem;
    }
    fieldset{
      border: 1px solid gray;
      border-radius: 5px;
      margin: 20px 0;
      padding: 20px;
    }
    fieldset legend{
      font-size: 1.3rem;
      font-weight: 600;
    }
    label{
      font-size: 1.2rem;
    }
    label:not(.contact-method){
      display: block;
      margin: 10px 0;
    }
    input:not(.contact-method-radio-btn), textarea{
      background-color: #ffffff1a;
      width: 95%;
      border: 1px solid gray;
      border-radius: 5px;
      padding: 10px;
    }
    input, input::placeholder, textarea{
      color: whitesmoke;
    }
    .contact-method-radio-btn{
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid gray;
      vertical-align: bottom;
    }
    .contact-method-radio-btn::before{
      content: " ";
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(3px,3px) scale(0);
      transition: all 0.3s ease-in;
    }
    .contact-method-radio-btn:checked::before{
      transform: translate(3px,3px) scale(1);
      background-color: lightgreen;
    }
    .submit-btn{
      cursor: pointer;
      background-color: royalblue;
      color: whitesmoke;
      border:none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 1.1rem;
      display: block;
      margin: auto;
    }
    .submit-btn:hover{
      background-color: midnightblue;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="title center">Parent Teacher Conference Form</h1>
    <p class="description center">Please fill out the form below to help schedule your parent-teacher conference.</p>
    <form action="">
      <!-- Student Information -->
      <fieldset>
        <legend>Student Information</legend>
        <label for="student-name">Full Name: </label>
        <input type="text" name="student-name" id="student-name" placeholder="E.g., Jane Doe" required>
        <label for="grade">Student Grade: </label>
        <input type="number" name="grade" id="grade" placeholder="E.g., 4" required>
      </fieldset>
      <!-- Parent Information -->
      <fieldset>
        <legend>Parent/Guardian Information</legend>
        <label for="parent-name">Parent/Guardian Name: </label>
        <input type="text" name="parent-name" id="parent-name" placeholder="E.g., Nancy Doe" required>
      </fieldset>
      <!-- Contact Information -->
       <fieldset>
        <legend>Preferred Contact Method</legend>
        <!-- Email -->
        <label class="contact-method" for="email">Email: </label>
        <input type="radio" id="email" value="email" name="contact-method" class="contact-method-radio-btn" checked>
        <!-- Phone -->
        <label class="contact-method" for="phone">Phone: </label>
        <input type="radio" id="phone" value="phone" name="contact-method" class="contact-method-radio-btn">
       </fieldset>
      <!-- Notes -->
       <fieldset>
        <legend>Additional Notes</legend>
        <label for="notes">Any specific concerns or topics you'd like to discuss?</label>
        <textarea name="notes" id="notes" rows="4" cols="50"></textarea>
       </fieldset>
      <!-- Submit -->
       <button class="submit-btn" type="submit">Submit Form</button>
    </form>
  </main>
</body>

</html>
